<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiszki</title>
  <meta name="theme-color" content="#5b4cf0">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
  <style>
    :root { --bg:#f3f4fb; --surface:#fff; --text:#1c1f35; --muted:#676c8c; --border:#e1e4f0; color-scheme:light; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f111a; --surface:#191c2a; --text:#e9eaf4; --muted:#9a9fbe; --border:#2d3248; color-scheme:dark; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--text);
           font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
    main { width:100%; max-width:440px; display:grid; gap:16px; text-align:center; }
    h1 { margin:0; font-size:2rem; font-weight:900; }
    p { margin:0; color:var(--muted); }
    a.card { display:flex; align-items:center; gap:16px; padding:18px; border-radius:20px; background:var(--surface); color:inherit; text-decoration:none;
             border:2px solid var(--border); border-bottom-width:5px; text-align:left; transition:transform .1s, border-color .15s; }
    a.card:hover { border-color:#5b4cf0; }
    a.card:active { transform:translateY(2px); }
    .logo { display:grid; place-items:center; width:56px; height:56px; flex:none; border-radius:16px; color:#fff; font-weight:900; font-size:1.2rem;
            background:linear-gradient(135deg,#5b4cf0,#8b3df0); }
    .logo.ua { background:linear-gradient(135deg,#0057b7,#2f7de1); color:#ffd500; }
    .logo.es { background:linear-gradient(135deg,#c60b1e,#e2452f); color:#ffc400; }
    .card b { display:block; font-size:1.2rem; }
  </style>
</head>
<body>
  <main>
    <h1>Fiszki</h1>
    <p>Wybierz język, którego chcesz się uczyć.</p>
    <a class="card" href="english/">
      <span class="logo">EN</span>
      <span><b>Angielski</b><span style="color:var(--muted)">Ponad 10 000 ćwiczeń i 47 lekcji – od pierwszych słów do C1</span></span>
    </a>
    <a class="card" href="ukrainian/">
      <span class="logo ua">UA</span>
      <span><b>Ukraiński</b><span style="color:var(--muted)">Ponad 10 000 ćwiczeń i 41 lekcji – od alfabetu do C1</span></span>
    </a>
    <a class="card" href="spanish/">
      <span class="logo es">ES</span>
      <span><b>Hiszpański</b><span style="color:var(--muted)">Ponad 10 000 ćwiczeń i 49 lekcji – od pierwszych słów do C1</span></span>
    </a>
  </main>
</body>
</html>
